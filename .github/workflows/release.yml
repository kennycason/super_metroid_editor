name: Build and Release

on:
  workflow_dispatch:  # Manual trigger
  release:
    types: [published]  # Also trigger on GitHub releases

jobs:
  build-and-release:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: super-metroid-editor-macos
            path: desktopApp/build/compose/binaries/main/dmg/*.dmg
            package_task: packageDistributionForCurrentOS
          - os: windows-latest
            artifact: super-metroid-editor-windows
            path: desktopApp/build/compose/binaries/main/msi/*.msi
            package_task: packageDistributionForCurrentOS
          - os: ubuntu-22.04
            artifact: super-metroid-editor-linux-deb
            path: desktopApp/build/compose/binaries/main/deb/*.deb
            package_task: packageDeb
          - os: ubuntu-22.04
            artifact: super-metroid-editor-fedora-rpm
            path: desktopApp/build/compose/binaries/main/rpm/*.rpm
            package_task: packageRpm
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: false

      - name: Checkout native audio and emulator submodules
        run: git submodule update --init --depth=1 tools/snes_spc tools/snes9x
        shell: bash

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc make

      - name: Expose native build tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          "$env:MSYS2_LOCATION\usr\bin" >> $env:GITHUB_PATH
          "$env:MSYS2_LOCATION\mingw64\bin" >> $env:GITHUB_PATH

      - name: Install build tools (Linux)
        if: matrix.package_task == 'packageRpm'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build and verify packaged SPC runtime
        run: ./gradlew :shared:spcRuntimeSmokeTest
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

      - name: Verify standalone SPC DLL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $imports = & objdump -p shared/src/jvmMain/resources/win32-x86-64/spc.dll
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect spc.dll dependencies" }
          $runtimeImports = $imports | Select-String 'DLL Name:\s*(libgcc|libstdc\+\+|libwinpthread|msys-)'
          if ($runtimeImports) { throw "spc.dll depends on unbundled compiler DLLs: $runtimeImports" }

      - name: Build and verify packaged Asar toolchain
        run: ./gradlew :desktopApp:asarToolchainSmokeTest
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

      - name: Run tests
        timeout-minutes: 45
        run: ./gradlew :shared:jvmTest :desktopApp:jvmTest --console=plain
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

      - name: Upload failed test reports
        if: failure() || cancelled()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.artifact }}
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
            desktopApp/build/reports/tests/
            desktopApp/build/test-results/
          if-no-files-found: ignore

      - name: Build application
        run: ./gradlew :desktopApp:${{ matrix.package_task }}
        shell: bash

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}

  attach-to-release:
    needs: build-and-release
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Prepare release assets
        run: |
          mkdir -p release-assets

          for f in super-metroid-editor-macos/*.dmg; do
            [ -f "$f" ] && cp "$f" release-assets/SuperMetroidEditor-macOS.dmg
          done

          for f in super-metroid-editor-windows/*.msi; do
            [ -f "$f" ] && cp "$f" release-assets/SuperMetroidEditor-Windows.msi
          done

          for f in super-metroid-editor-linux-deb/*.deb; do
            [ -f "$f" ] && cp "$f" release-assets/SuperMetroidEditor-Linux.deb
          done

          for f in super-metroid-editor-fedora-rpm/*.rpm; do
            [ -f "$f" ] && cp "$f" release-assets/SuperMetroidEditor-Fedora.rpm
          done

          ls -lh release-assets/

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          tag_name: ${{ github.event.release.tag_name }}
