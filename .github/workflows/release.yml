name: Build and Release

on:
  workflow_dispatch:  # Manual trigger
  release:
    types: [published]  # Also trigger on GitHub releases

jobs:
  build-and-release:
    # A manual run is the validation and packaging gate. Publishing a release
    # reuses these exact artifacts instead of rebuilding and rerunning the full
    # UI suite on a new set of runners.
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: super-metroid-editor-macos
            path: desktopApp/build/compose/binaries/main/dmg/*.dmg
            package_task: packageDistributionForCurrentOS
            run_tests: true
          - os: windows-latest
            artifact: super-metroid-editor-windows
            path: desktopApp/build/compose/binaries/main/msi/*.msi
            package_task: packageDistributionForCurrentOS
            run_tests: true
          - os: ubuntu-22.04
            artifact: super-metroid-editor-linux-deb
            path: desktopApp/build/compose/binaries/main/deb/*.deb
            package_task: packageDeb
            run_tests: true
          - os: ubuntu-22.04
            artifact: super-metroid-editor-fedora-rpm
            path: desktopApp/build/compose/binaries/main/rpm/*.rpm
            package_task: packageRpm
            run_tests: false
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: false

      - name: Checkout native audio and emulator submodules
        run: git submodule update --init --depth=1 tools/snes_spc tools/snes9x
        shell: bash

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc make

      - name: Expose native build tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          "$env:MSYS2_LOCATION\usr\bin" >> $env:GITHUB_PATH
          "$env:MSYS2_LOCATION\mingw64\bin" >> $env:GITHUB_PATH

      - name: Install build tools (Linux)
        if: matrix.package_task == 'packageRpm'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Bootstrap Gradle wrapper
        shell: bash
        run: |
          for retry_delay in 15 30 60 120 120 0; do
            if ./gradlew --version; then
              exit 0
            fi
            if [ "$retry_delay" -eq 0 ]; then
              exit 1
            fi
            echo "Gradle distribution download failed; retrying in ${retry_delay}s..."
            sleep "$retry_delay"
          done

      - name: Build and verify packaged SPC runtime
        run: ./gradlew :shared:spcRuntimeSmokeTest
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

      - name: Verify standalone SPC DLL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $imports = & objdump -p shared/src/jvmMain/resources/win32-x86-64/spc.dll
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect spc.dll dependencies" }
          $runtimeImports = $imports | Select-String 'DLL Name:\s*(libgcc|libstdc\+\+|libwinpthread|msys-)'
          if ($runtimeImports) { throw "spc.dll depends on unbundled compiler DLLs: $runtimeImports" }

      - name: Build and verify packaged Asar toolchain
        run: ./gradlew :desktopApp:asarToolchainSmokeTest
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

      - name: Run tests
        if: matrix.run_tests
        timeout-minutes: 45
        run: |
          for attempt in 1 2; do
            if ./gradlew :shared:jvmTest :desktopApp:jvmTest --console=plain; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi
            echo "::warning::Test task failed once; retrying to distinguish a transient native UI race from a persistent failure."
          done
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

      - name: Upload failed test reports
        if: matrix.run_tests && (failure() || cancelled())
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.artifact }}
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
            desktopApp/build/reports/tests/
            desktopApp/build/test-results/
          if-no-files-found: ignore

      - name: Build application
        run: ./gradlew :desktopApp:${{ matrix.package_task }}
        shell: bash

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}

  attach-to-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      actions: read
      contents: write

    steps:
      - name: Find successful validated build
        id: validated-build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag_sha="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha')"
          run_id="$(gh api "repos/$GH_REPO/actions/workflows/release.yml/runs?event=workflow_dispatch&status=success&per_page=100" \
            --jq "[.workflow_runs[] | select(.head_sha == \"$tag_sha\")] | first | .id // empty")"

          if [ -z "$run_id" ]; then
            echo "No successful manual Build and Release run exists for $RELEASE_TAG ($tag_sha)." >&2
            echo "Run this workflow manually for that commit before publishing its release." >&2
            exit 1
          fi

          echo "Using validated workflow run $run_id for $RELEASE_TAG ($tag_sha)."
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.validated-build.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Prepare release assets
        run: |
          mkdir -p release-assets

          for f in super-metroid-editor-macos/*.dmg; do
            [ -f "$f" ] && cp "$f" release-assets/SuperMetroidEditor-macOS.dmg
          done

          for f in super-metroid-editor-windows/*.msi; do
            [ -f "$f" ] && cp "$f" release-assets/SuperMetroidEditor-Windows.msi
          done

          for f in super-metroid-editor-linux-deb/*.deb; do
            [ -f "$f" ] && cp "$f" release-assets/SuperMetroidEditor-Linux.deb
          done

          for f in super-metroid-editor-fedora-rpm/*.rpm; do
            [ -f "$f" ] && cp "$f" release-assets/SuperMetroidEditor-Fedora.rpm
          done

          for asset in \
            SuperMetroidEditor-macOS.dmg \
            SuperMetroidEditor-Windows.msi \
            SuperMetroidEditor-Linux.deb \
            SuperMetroidEditor-Fedora.rpm; do
            if [ ! -f "release-assets/$asset" ]; then
              echo "Validated run is missing required release asset: $asset" >&2
              exit 1
            fi
          done

          ls -lh release-assets/

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          tag_name: ${{ github.event.release.tag_name }}
