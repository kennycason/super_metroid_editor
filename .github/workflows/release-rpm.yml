name: Build and Release RPM

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-rpm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: false

      - name: Checkout snes9x submodule
        run: git submodule update --init --depth=1 tools/snes9x
        shell: bash

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install RPM build tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-rpm-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-rpm-gradle-
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew :shared:jvmTest :desktopApp:jvmTest
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

      - name: Build RPM
        run: ./gradlew :desktopApp:packageRpm
        shell: bash

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: super-metroid-editor-fedora-rpm
          path: desktopApp/build/compose/binaries/main/rpm/*.rpm

  attach-to-release:
    needs: build-rpm
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write

    steps:
      - name: Download RPM artifact
        uses: actions/download-artifact@v4
        with:
          name: super-metroid-editor-fedora-rpm
          path: rpm-artifact

      - name: Prepare release asset
        run: |
          mkdir -p release-assets

          for f in rpm-artifact/*.rpm; do
            [ -f "$f" ] && cp "$f" release-assets/SuperMetroidEditor-Fedora.rpm
          done

          ls -lh release-assets/

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          tag_name: ${{ github.event.release.tag_name }}
